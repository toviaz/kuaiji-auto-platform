<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用户管理 · 快记自动化测试平台</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1><a href="/">快记自动化测试平台</a></h1>
      <div class="sub">用户管理</div>
    </div>
    <div class="user-area" id="header-user"></div>
  </div>
  <nav id="site-nav"></nav>
</header>
<main>
  <div class="card">
    <h2>账号 <span class="muted" id="count"></span></h2>
    <p class="muted">管理员可以改角色。普通账号只能看用例、结果和报告。</p>
    <p id="err" class="err"></p>
    <div id="table">加载中…</div>
  </div>
</main>
<script src="/static/app.js"></script>
<script>
header("users");
async function load() {
  const d = await api("/api/users");
  const rows = d.users || [];
  document.getElementById("count").textContent = rows.length + " 人";
  if (!rows.length) {
    document.getElementById("table").innerHTML = `<div class="empty">还没有账号</div>`;
    return;
  }
  document.getElementById("table").innerHTML = `<table><thead><tr>
    <th>显示名</th><th>账号</th><th>来源</th><th>角色</th><th>状态</th><th>操作</th>
  </tr></thead><tbody>${rows.map(u => `<tr>
    <td>${u.name || "-"}</td>
    <td>${u.username || "-"}</td>
    <td>${u.source === "feishu" ? "飞书" : "本机"}</td>
    <td><span class="pill ${u.role}">${u.role_label}</span></td>
    <td><span class="pill ${u.status}">${u.status === "pending" ? "待审核" : "已通过"}</span></td>
    <td class="ops">
      ${u.status === "pending" ? `<button class="btn sm" data-act="approve" data-id="${u.id}">通过</button>` : ""}
      ${u.role === "admin" ? `<button class="btn sm ghost" data-act="user" data-id="${u.id}">设为普通账号</button>` : `<button class="btn sm ghost" data-act="admin" data-id="${u.id}">设为管理员</button>`}
    </td>
  </tr>`).join("")}</tbody></table>`;
}
async function act(e) {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const err = document.getElementById("err");
  err.textContent = "";
  const id = btn.dataset.id;
  const url = btn.dataset.act === "approve"
    ? `/api/users/${id}/approve`
    : `/api/users/${id}/role`;
  const body = btn.dataset.act === "approve" ? {} : {role: btn.dataset.act};
  const r = await fetch(url, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    err.textContent = d.detail || d.error || r.statusText;
    return;
  }
  await load();
}
document.getElementById("table").onclick = act;
load().catch(e => { document.getElementById("table").textContent = e.message; });
</script>
</body>
</html>
