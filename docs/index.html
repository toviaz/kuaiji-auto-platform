<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>快记自动化测试平台</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #0b1220; color: #e2e8f0; }
    main { max-width: 640px; margin: 80px auto; padding: 0 24px; }
    h1 { font-size: 28px; }
    p { color: #94a3b8; line-height: 1.6; }
    a { color: #93c5fd; }
    code { background: #1e293b; padding: 2px 6px; border-radius: 6px; color: #e2e8f0; }
    pre { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 14px; overflow: auto; }
  </style>
</head>
<body>
<main>
  <h1>快记自动化测试平台</h1>
  <p>用例、执行结果、测试报告。本机跑，不在网页上直接执行真机。</p>
  <p><a href="https://github.com/toviaz/kuaiji-auto-platform">GitHub 仓库</a></p>
  <pre><code>git clone https://github.com/toviaz/kuaiji-auto-platform.git
cd kuaiji-auto-platform
python3 -m venv .venv
.venv/bin/pip install -r requirements.txt
.venv/bin/python -m app web</code></pre>
  <p>打开 <code>http://127.0.0.1:8765</code>，先登录。支持飞书登录和本机账号。</p>
</main>
</body>
</html>
